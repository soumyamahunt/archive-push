# Applies a zip archive, stored as a release asset in a private archives repo,
# to a branch of a target repo, pushes a commit, then deletes the release.
#
# Setup:
#   1. Create a private repo for archives (default: soumyamahunt/archives).
#   2. Create a fine-grained PAT with "Contents: Read and write" on the archives
#      repo and on every target repo, and save it as the PUSH_TOKEN secret.
#
# Upload an archive:
#   gh release create drop-1 build.zip -R soumyamahunt/archives --notes ""
#
# Run:
#   gh workflow run apply-archive.yml -R <this-repo> \
#     -f archive_tag=drop-1 -f repo=owner/name -f branch=main -f message="Update"
​
name: Apply archive to repo
​
on:
  workflow_dispatch:
    inputs:
      archive_tag:
        description: Release tag holding the .zip
        required: true
      repo:
        description: Target repo (owner/name)
        required: true
      branch:
        description: Branch to commit to
        required: true
        default: main
      message:
        description: Commit message
        required: true
      replace:
        description: Delete files that aren't in the archive
        type: boolean
        default: false
      archive_repo:
        description: Repo whose releases hold the archives
        required: true
        default: soumyamahunt/archives
​
permissions: {}
​
concurrency:
  group: apply-${{ inputs.repo }}-${{ inputs.branch }}
  cancel-in-progress: false
​
jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.PUSH_TOKEN }}
      ARCHIVE_REPO: ${{ inputs.archive_repo }}
      TAG: ${{ inputs.archive_tag }}
    steps:
      - name: Download and extract archive
        run: |
          mkdir -p "$RUNNER_TEMP/src"
          gh release download "$TAG" -R "$ARCHIVE_REPO" -p '*.zip' -O "$RUNNER_TEMP/archive.zip"
          unzip -q "$RUNNER_TEMP/archive.zip" -d "$RUNNER_TEMP/src"
​
          # If the zip wraps everything in one top-level folder, use its contents
          cd "$RUNNER_TEMP/src"
          entry="$(ls -A)"
          if [ "$(ls -A | wc -l)" -eq 1 ] && [ -d "$entry" ]; then
            echo "SRC=$RUNNER_TEMP/src/$entry" >> "$GITHUB_ENV"
          else
            echo "SRC=$RUNNER_TEMP/src" >> "$GITHUB_ENV"
          fi
​
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.branch }}
          token: ${{ secrets.PUSH_TOKEN }}
          path: target
​
      - name: Copy, commit and push
        working-directory: target
        env:
          MSG: ${{ inputs.message }}
          BRANCH: ${{ inputs.branch }}
          REPO: ${{ inputs.repo }}
          REPLACE: ${{ inputs.replace }}
        run: |
          flags=(-a --exclude=.git)
          [ "$REPLACE" = "true" ] && flags+=(--delete)
          rsync "${flags[@]}" "$SRC/" ./
​
          git add -A
          if git diff --cached --quiet; then
            echo "::notice::No changes to commit"
            exit 0
          fi
​
          # Attribute the commit to the token's owner via their noreply address
          read -r id login < <(gh api user --jq '"\(.id) \(.login)"')
          git config user.name "$login"
          git config user.email "$id+$login@users.noreply.github.com"
​
          git commit -m "$MSG"
          git push origin "HEAD:$BRANCH"
          echo "::notice::Pushed $(git rev-parse --short HEAD) to $REPO@$BRANCH"
​
      # Runs only when everything above succeeded, so a failed run keeps the
      # archive for a retry
      - name: Delete archive release
        run: gh release delete "$TAG" -R "$ARCHIVE_REPO" --cleanup-tag -y
